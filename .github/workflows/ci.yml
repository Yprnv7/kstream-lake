name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Test Java Kafka Streams Topology
      run: |
        mvn clean test

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Lakehouse Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt

    - name: Run Python Lakehouse & OLAP Tests
      run: |
        cd python && PYTHONPATH=. pytest tests/ -v

    - name: Run Parquet & DuckDB Benchmarks
      run: |
        cd python && PYTHONPATH=. python benchmarks/run_benchmark.py
